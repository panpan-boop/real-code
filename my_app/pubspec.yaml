name: alag_ap
description: ALAG-AP — Animal rescue and adoption app for the Philippines.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & networking
  http: ^1.2.1

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # Location
  geolocator: ^11.0.0

  # Image picking
  image_picker: ^1.1.2

  # Local storage
  shared_preferences: ^2.3.1

  # URL launching
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # No assets section needed — logo is embedded directly in the Dart code